[package]
name = "cg-search"
description = "Game-independent search for bots: Monte Carlo tree search and time budgets. Standard library only."
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

# Only workspace crates: the bundler copies this crate into bots.
[dependencies]
cg-core.workspace = true

# Analysis code, which bots do not use: the bundler drops the lines that
# `#[cfg(feature = "analysis")]` marks. A crate that analyses positions turns
# it on in its dependency on this one.
[features]
analysis = []

# This crate's own tests cover the analysis code, so they turn the feature
# on through a dependency on the crate itself (which only tests build).
[dev-dependencies]
cg-search = { path = ".", features = ["analysis"] }

[lints]
workspace = true
