# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# CI runs `cargo deny check` on every push and pull request.

[graph]
all-features = true

[advisories]
# Fail on dependencies with known security advisories or yanked versions.
yanked = "deny"

[licenses]
# Dependencies must be compatible with distributing this repo under
# MIT OR Apache-2.0 (ADR 0001). Widen this list only in a PR that says why.
# - Unicode-3.0: the Unicode data in unicode-ident, used by the proc-macros
#   behind clap and serde (tools only). Permissive and compatible.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
