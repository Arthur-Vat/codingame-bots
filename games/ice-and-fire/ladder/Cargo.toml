[package]
name = "ice-and-fire-ladder"
description = "The ladder of reference bots of A Code of Ice and Fire: bronze's turn plus steps from the shared tactics, one more step for each bot. Standard library only."
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

# Only workspace crates: the bundler copies them into the bots.
[dependencies]
ice-and-fire-engine.workspace = true
ice-and-fire-tactics.workspace = true

# Used by the tests only; never part of a bot.
[dev-dependencies]
cg-core.workspace = true
ice-and-fire-policy.workspace = true
ice-and-fire-referee.workspace = true

[lints]
workspace = true
