[package]
name = "ice-and-fire-bot-plan"
description = "Plan-search bot for A Code of Ice and Fire (E002, E003): an opening by rules until the territories meet, then hill climbing over single actions and macro actions, replayed against a memory of the opponent's replies, after the contest's winner."
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
cg-core.workspace = true
ice-and-fire-engine.workspace = true
ice-and-fire-opening.workspace = true
ice-and-fire-policy.workspace = true
ice-and-fire-tactics.workspace = true

# The analysis mode (`bank`, `speed`), which bots never carry: the bundler drops the
# lines that `#[cfg(feature = "analysis")]` marks.
[features]
analysis = []

# Used by the tests only: the bot is played in-process against the referee.
[dev-dependencies]
cg-arena.workspace = true
ice-and-fire-referee.workspace = true

[lints]
workspace = true
