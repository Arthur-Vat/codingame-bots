[package]
name = "ice-and-fire-bot-sparring"
description = "Sparring bot for A Code of Ice and Fire in zasmu's style: a tower wall at the front, mines on safe spots, level 1 units for land, gold saved for the strike on the enemy HQ."
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

# Only workspace crates: the bundler copies them into the bot.
[dependencies]
ice-and-fire-engine.workspace = true
ice-and-fire-tactics.workspace = true

# Used by the tests only; never part of the bot.
[dev-dependencies]
ice-and-fire-referee.workspace = true

[lints]
workspace = true
