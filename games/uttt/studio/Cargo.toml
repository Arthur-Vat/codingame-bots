[package]
name = "uttt-studio"
description = "Ultimate Tic-Tac-Toe's adapter for the studio."
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
cg-arena.workspace = true
serde_json.workspace = true
studio-game.workspace = true
uttt-analysis = { workspace = true, optional = true }
uttt-referee.workspace = true

[features]
# The analysis program (ADR 0032), for the local server. Off by default, so
# that the rules program for the browser (studio-rules) does not grow by it.
analysis = ["dep:uttt-analysis"]

[lints]
workspace = true
