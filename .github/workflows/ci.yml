name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CodinGame's Rust compiler (docs/CODINGAME.md, ADR 0010).
  # Keep in sync with `rust-version` in Cargo.toml.
  CG_RUST: "1.90.0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  codingame:
    name: CodinGame compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Bundle every bot into one paste-ready file
        run: scripts/bundle-bots.sh
      - name: Size and standalone build of each paste-ready file
        env:
          CG_BIN_DIR: target/cg/bin
        run: scripts/cg-check.sh target/cg/*.rs
      - name: Play 1,000 games between the bundled random bots
        run: |
          cargo build --release --locked -p uttt-arena
          target/release/uttt-arena \
            --bot random=target/cg/bin/uttt-random \
            --bot random-again=target/cg/bin/uttt-random \
            --pairs 500 --expect-no-faults --out target/cg/uttt-smoke.jsonl
      - name: Publish the paste-ready files
        uses: actions/upload-artifact@v7
        with:
          name: paste-ready-bots
          path: target/cg/*.rs
          if-no-files-found: error

  licenses:
    name: Dependency licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
