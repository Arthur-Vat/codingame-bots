name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Unlike GitHub's default, fails a step when any command of a pipeline
    # fails, not only the last one.
    shell: bash

env:
  # CodinGame's Rust compiler (docs/CODINGAME.md, ADR 0010).
  # Keep in sync with `rust-version` in Cargo.toml.
  CG_RUST: "1.90.0"
  CARGO_TERM_COLOR: always

jobs:
  # Which areas the pull request changes (ADR 0029). Every job below that
  # depends on an area reads this job's outputs, and `ci-passed` gathers them.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scopes.outputs.rust }}
      framework: ${{ steps.scopes.outputs.framework }}
      games: ${{ steps.scopes.outputs.games }}
      studio: ${{ steps.scopes.outputs.studio }}
      web: ${{ steps.scopes.outputs.web }}
      licenses: ${{ steps.scopes.outputs.licenses }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit, to see which files a pull request changes.
          fetch-depth: 2
      - name: Decide which checks run
        id: scopes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # In a pull request, HEAD is the merge commit and HEAD^1 the base.
            # NUL-separated: git quotes the odd file names otherwise. Written
            # to a file first: a process substitution would hide a failure of
            # git, and no files would then mean no checks.
            if ! git diff -z --name-only --no-renames HEAD^1 HEAD >"$RUNNER_TEMP/changed-files"; then
              echo "::error title=Changes::git diff failed; the changed files are unknown"
              exit 1
            fi
            mapfile -d '' -t files <"$RUNNER_TEMP/changed-files"
            scopes="$(scripts/ci-scopes.sh ci -- "${files[@]}")" || {
              echo "::error title=Changes::scripts/ci-scopes.sh failed"
              exit 1
            }
          else
            # Pushes to main and runs by hand check everything.
            scopes="$(scripts/ci-scopes.sh ci --all)" || {
              echo "::error title=Changes::scripts/ci-scopes.sh failed"
              exit 1
            }
          fi
          echo "$scopes" | tee -a "$GITHUB_OUTPUT"
          {
            echo '```text'
            echo "$scopes"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  lint:
    name: "Workspace: format and lint"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Job logs are not always at hand; annotate.sh carries a failing step's
      # output excerpt to the check run as an annotation.
      - name: Format
        run: scripts/annotate.sh run Format cargo fmt --all -- --check
      - name: Lint
        run: scripts/annotate.sh run Lint cargo clippy --workspace --all-targets --locked -- -D warnings
      # The line above builds cg-search's tests, which turn its `analysis`
      # feature on for the whole workspace. Bots run without it: lint that.
      - name: Lint without analysis
        run: scripts/annotate.sh run "Lint without analysis" cargo clippy -p cg-search --lib --locked -- -D warnings

  framework-tests:
    name: "Framework: tests"
    needs: changes
    # A game's change runs them too: the bundler's tests bundle the game's
    # bots (ADR 0029).
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          # The bundler's tests bundle bots, which formats the result.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test the shared crates
        run: |
          # Every package whose manifest is under crates/.
          mapfile -t packages < <(cargo metadata --no-deps --format-version 1 |
            jq -r --arg root "$GITHUB_WORKSPACE/crates/" '.packages[] | select(.manifest_path | startswith($root)) | .name')
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error title=Framework tests::no package under crates/"
            exit 1
          fi
          args=()
          for package in "${packages[@]}"; do
            args+=(-p "$package")
          done
          scripts/annotate.sh run "Framework tests" cargo test --locked "${args[@]}"

  game-tests:
    name: "${{ matrix.game }}: tests"
    needs: changes
    # An empty matrix is an error: skip the job instead.
    if: needs.changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          # The tests may bundle bots, which formats the result.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.game }}
      - name: Test the game
        env:
          GAME: ${{ matrix.game }}
        run: |
          # Every package whose manifest is under games/<game>/.
          mapfile -t packages < <(cargo metadata --no-deps --format-version 1 |
            jq -r --arg root "$GITHUB_WORKSPACE/games/$GAME/" '.packages[] | select(.manifest_path | startswith($root)) | .name')
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error title=$GAME tests::no package under games/$GAME/"
            exit 1
          fi
          args=()
          for package in "${packages[@]}"; do
            args+=(-p "$package")
          done
          scripts/annotate.sh run "$GAME tests" cargo test --locked "${args[@]}"

  game-bots:
    name: "${{ matrix.game }}: bots"
    needs: changes
    if: needs.changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit, to see which release files a pull request adds.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.game }}
      - name: Bundle every bot into one paste-ready file
        run: scripts/annotate.sh run "Bundle the bots" scripts/bundle-bots.sh "$GAME"
      - name: Size and standalone build of each paste-ready file
        env:
          CG_BIN_DIR: target/cg/bin
        run: |
          # One file per bot folder: a glob on the game's name would also
          # match a game whose id starts with it (uttt-x).
          files=()
          for dir in "games/$GAME"/bots/*/; do
            files+=("target/cg/$GAME-$(basename "$dir").rs")
          done
          scripts/annotate.sh run "Size and standalone build" scripts/cg-check.sh "${files[@]}"
      - name: New releases match their sources; released files are frozen
        if: github.event_name == 'pull_request'
        # In a pull request, HEAD is the merge commit and HEAD^1 the base.
        run: scripts/annotate.sh run "Release check" scripts/check-releases.sh HEAD^1 "$GAME"
      - name: The game's own checks
        run: |
          # Each game provides games/<game>/ci.sh (ADR 0029).
          if [ ! -x "games/$GAME/ci.sh" ]; then
            echo "::error title=$GAME checks::games/$GAME/ci.sh is missing or not executable"
            exit 1
          fi
          "games/$GAME/ci.sh"
      - name: Collect the paste-ready files of the game
        run: |
          mkdir -p target/cg/paste-ready
          for dir in "games/$GAME"/bots/*/; do
            cp "target/cg/$GAME-$(basename "$dir").rs" target/cg/paste-ready/
          done
      - name: Publish the paste-ready files
        uses: actions/upload-artifact@v7
        with:
          name: paste-ready-bots-${{ matrix.game }}
          path: target/cg/paste-ready/
          if-no-files-found: error
      - name: New releases replay identically with a fixed seed and iterations
        if: github.event_name == 'pull_request'
        run: |
          # Written to a file first: a process substitution would hide a
          # failure of git, and no files would then mean no check.
          if ! git diff --name-only --diff-filter=A --no-renames HEAD^1 HEAD -- "games/$GAME/releases/*.rs" >"$RUNNER_TEMP/added-releases"; then
            echo "::error title=Determinism::git diff failed; the added releases are unknown"
            exit 1
          fi
          mapfile -t added <"$RUNNER_TEMP/added-releases"
          if [ "${#added[@]}" -eq 0 ]; then
            echo "no new release"
            exit 0
          fi
          for file in "${added[@]}"; do
            scripts/annotate.sh run "Determinism of $file" scripts/check-determinism.sh "$GAME" 500 "$file"
          done

  licenses:
    name: Dependency licenses and sources
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    env:
      # The version EmbarkStudios/cargo-deny-action used on 2026-10-11; bump
      # both together, the checksum is the archive's.
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
      - name: Install cargo-deny
        run: |
          archive="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          scripts_dir="$GITHUB_WORKSPACE/scripts"
          "$scripts_dir/annotate.sh" run "Download cargo-deny" curl -sSfL --retry 3 -O \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$archive.tar.gz"
          echo "$CARGO_DENY_SHA256  $archive.tar.gz" | "$scripts_dir/annotate.sh" run "Checksum of cargo-deny" sha256sum -c -
          tar -xzf "$archive.tar.gz"
          echo "$RUNNER_TEMP/$archive" >>"$GITHUB_PATH"
      - name: Licenses, bans, advisories and sources
        run: scripts/annotate.sh run "cargo deny" cargo deny --log-level warn --all-features check

  studio-server:
    name: "Studio: server"
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          # The tests may bundle bots, which formats the result.
          components: rustfmt
          # The rules program and the releases are built to WebAssembly.
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Test the studio and the games' adapters
        run: |
          # Every package whose manifest is under studio/ or games/*/studio/.
          mapfile -t packages < <(cargo metadata --no-deps --format-version 1 |
            jq -r --arg root "$GITHUB_WORKSPACE/" '.packages[] | select(.manifest_path | ltrimstr($root) | test("^(studio/|games/[^/]+/studio/)")) | .name')
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error title=Studio tests::no package under studio/"
            exit 1
          fi
          args=()
          for package in "${packages[@]}"; do
            args+=(-p "$package")
          done
          scripts/annotate.sh run "Studio tests" cargo test --locked "${args[@]}"
      - name: Test the adapter without its analysis feature
        # The step above builds uttt-studio together with the server, which
        # turns its feature "analysis" on. Alone it is built without, as in the
        # rules program, and its test of that case runs only here.
        run: scripts/annotate.sh run "Adapter without analysis" cargo test --locked -p uttt-studio
      - name: Build the rules and the releases to WebAssembly
        # --strict: a release that does not compile to WebAssembly fails the
        # step, so that none is left out of the browser's list unnoticed.
        run: scripts/annotate.sh run "WebAssembly build" scripts/build-studio-wasm.sh "$RUNNER_TEMP/wasm" --strict

  studio-web:
    name: "Studio: front end"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          # The browser engine runs the rules program and the releases as
          # WebAssembly (ADR 0030): the tests need them built.
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          # The Node line is written once, in `engines` (ADR 0026).
          node-version-file: studio/web/package.json
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: Install the locked dependencies
        id: install
        # Job logs are not always at hand; the annotation carries the failure
        # to the check run.
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "npm ci" npm ci
      # The next steps run even when an earlier one fails, so that one run
      # reports every problem.
      - name: Licenses of the packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Licenses" npm run licenses
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Format" npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Lint" npm run lint
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Type check" npm run typecheck
      - name: Build the rules and the releases to WebAssembly
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # --strict: a release that does not compile to WebAssembly fails the
        # step. The unit tests of the browser engine and the browser tests
        # read the files it writes in public/wasm/.
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "WebAssembly build" "$GITHUB_WORKSPACE/scripts/build-studio-wasm.sh" --strict
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Unit tests" npm test
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Build" npm run build
      - name: License notices
        # The Pages workflow runs the same step; failing here, a missing
        # license file never reaches a deployment (ADR 0030, decision 7).
        # Needs Rust for `cargo metadata`, which this job has (see above).
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "License notices" npm run notices
      - name: Install Chromium for the browser tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Install Chromium" npx playwright install --with-deps chromium
      - name: Browser tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run e2e

  studio-windows:
    name: "Studio: Windows"
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    # The owner runs the studio on Windows (ADR 0025). Git Bash, curl and jq
    # are preinstalled on the runner.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
      - uses: Swatinem/rust-cache@v2
      - name: Test the studio and the arena
        # The studio's server tests compile a release with rustc and play bot
        # games; the arena's unix-only tests are skipped on Windows.
        run: scripts/annotate.sh run "Test the studio and the arena" cargo test --locked -p studio -p studio-core -p studio-rules -p studio-game -p uttt-studio -p ice-and-fire-studio -p cg-arena
      - name: Test the adapter without its analysis feature
        # The step above builds uttt-studio together with the server, which
        # turns its feature "analysis" on. Alone it is built without, as in the
        # rules program, and its test of that case runs only here.
        run: scripts/annotate.sh run "Adapter without analysis" cargo test --locked -p uttt-studio
      - name: Build the server
        run: scripts/annotate.sh run "Build the server" cargo build --locked --release -p studio
      - name: Play a bot against a bot through the server
        run: |
          port=8499
          base="http://127.0.0.1:$port"
          # An empty folder stands for the front end, which this job does not build.
          web="$RUNNER_TEMP/studio-web"
          mkdir -p "$web"
          target/release/studio.exe --port "$port" --web "$web" >studio.log 2>&1 &
          server=$!
          stop() {
            local status=$?
            kill "$server" 2>/dev/null || true
            echo "--- server log"
            cat studio.log || true
            if [ "$status" != 0 ]; then
              scripts/annotate.sh file "Studio server log" studio.log
            fi
          }
          trap stop EXIT

          up=""
          for _ in $(seq 60); do
            if curl -sS --max-time 5 "$base/api/games" >/dev/null; then
              up=yes
              break
            fi
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "::error title=Studio on Windows::the server did not answer within 60 s"
            exit 1
          fi

          seat='{"kind":"bot","release":"uttt-v001","think_ms":50,"mode":"realtime"}'
          body="{\"game\":\"uttt\",\"seed\":1,\"opening_plies\":0,\"seats\":[$seat,$seat]}"
          created="$(curl -sS --max-time 30 -X POST -H 'Content-Type: application/json' \
            -d "$body" "$base/api/sessions")"
          echo "$created"
          id="$(jq -r '.id // empty' <<<"$created" | tr -d '\r')"
          if [ -z "$id" ]; then
            echo "::error title=Studio on Windows::the session was not created"
            exit 1
          fi

          status=""
          session=""
          for _ in $(seq 120); do
            session="$(curl -sS --max-time 10 "$base/api/sessions/$id" || true)"
            status="$(jq -r '.status // empty' <<<"$session" 2>/dev/null | tr -d '\r' || true)"
            case "$status" in
              over | failed) break ;;
            esac
            sleep 1
          done
          echo "status: $status"
          jq -c '{status, error, turns: (.turns | length), result}' <<<"$session" || true
          if [ "$status" != over ]; then
            echo "::error title=Studio on Windows::the game ended with status '$status' instead of 'over'"
            exit 1
          fi

  docs:
    name: Docs and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Indexes, status lines and links match the repository
        run: scripts/annotate.sh run "Docs check" scripts/check-docs.sh
      # The next steps run even when an earlier one fails, so that one run
      # reports every problem.
      - name: Lint the shell scripts
        if: ${{ !cancelled() }}
        # Preinstalled on ubuntu-latest.
        run: scripts/annotate.sh run Shellcheck shellcheck scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh games/*/ci.sh
      - name: Test the agent guard
        if: ${{ !cancelled() }}
        run: scripts/annotate.sh run "Agent guard test" scripts/tests/agent-guard-test.sh
      - name: Test the annotation wrapper
        if: ${{ !cancelled() }}
        run: scripts/annotate.sh run "Annotation wrapper test" scripts/tests/annotate-test.sh
      - name: Test the CI scopes
        if: ${{ !cancelled() }}
        run: scripts/annotate.sh run "CI scopes test" scripts/tests/ci-scopes-test.sh
      - name: Test the arena archive
        if: ${{ !cancelled() }}
        run: scripts/annotate.sh run "Arena archive test" scripts/tests/arena-archive-test.sh
      - name: Test the league check
        if: ${{ !cancelled() }}
        run: scripts/annotate.sh run "League check test" scripts/tests/league-check-test.sh
      - name: Test the size check
        if: ${{ !cancelled() }}
        # rustc and iconv are preinstalled on ubuntu-latest.
        run: scripts/annotate.sh run "Size check test" scripts/tests/cg-check-test.sh
      - name: Lint the workflows
        if: ${{ !cancelled() }}
        # The image is pinned; it includes shellcheck, which also lints the
        # `run` steps.
        run: scripts/annotate.sh run Actionlint docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # The one check branch protection requires for this workflow (ADR 0029):
  # the jobs above come and go with the areas a pull request changes, this one
  # always runs and says whether every job that had to run succeeded.
  ci-passed:
    name: CI passed
    needs:
      - changes
      - lint
      - framework-tests
      - game-tests
      - game-bots
      - licenses
      - studio-server
      - studio-windows
      - studio-web
      - docs
    # Never `!cancelled()`: GitHub counts a skipped required check as passed,
    # so this job must run when the run is cancelled too, and then fail.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Every job that had to run succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUST: ${{ needs.changes.outputs.rust }}
          FRAMEWORK: ${{ needs.changes.outputs.framework }}
          GAMES: ${{ needs.changes.outputs.games }}
          STUDIO: ${{ needs.changes.outputs.studio }}
          WEB: ${{ needs.changes.outputs.web }}
          LICENSES: ${{ needs.changes.outputs.licenses }}
        run: |
          # Empty when the changes job failed: the verdict then fails.
          case "$GAMES" in
            '') HAS_GAMES='' ;;
            '[]') HAS_GAMES=false ;;
            *) HAS_GAMES=true ;;
          esac
          # The framework's tests run for a framework change and for a game's.
          if [ -z "$FRAMEWORK" ] || [ -z "$HAS_GAMES" ]; then
            FRAMEWORK_TESTS=''
          elif [ "$FRAMEWORK" = true ] || [ "$HAS_GAMES" = true ]; then
            FRAMEWORK_TESTS=true
          else
            FRAMEWORK_TESTS=false
          fi
          scripts/ci-scopes.sh results changes=true lint="$RUST" framework-tests="$FRAMEWORK_TESTS" \
            game-tests="$HAS_GAMES" game-bots="$HAS_GAMES" licenses="$LICENSES" \
            studio-server="$STUDIO" studio-windows="$STUDIO" studio-web="$WEB" docs=true
