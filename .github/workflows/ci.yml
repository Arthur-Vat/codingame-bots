name: CI

# Scratch branch only, never merged: measures the timing bot's workload speed
# on GitHub's runners for ADR 0048 (A Code of Ice and Fire at CodinGame's
# speed). Started by hand with workflow_dispatch on this branch.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CG_RUST: "1.90.0"

jobs:
  speed:
    name: Runner speed ${{ matrix.runner }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
      - name: Machine
        run: |
          lscpu | grep -E "^(Model name|CPU\(s\)|Thread|CPU max MHz)"
          nproc
      - name: Build
        run: |
          scripts/bundle-bots.sh ice-and-fire >/dev/null
          mkdir -p target/cg/bin
          for b in timing random; do
            rustc --edition 2021 -C opt-level=3 --crate-type bin \
              -o "target/cg/bin/ice-and-fire-$b" "target/cg/ice-and-fire-$b.rs" 2>/dev/null
          done
          cargo build --release --locked -q -p ice-and-fire-arena
      - name: Measure
        run: |
          a=target/release/ice-and-fire-arena
          t=timing=target/cg/bin/ice-and-fire-timing
          for round in 1 2; do
            "$a" match --bot "$t" --bot random=target/cg/bin/ice-and-fire-random \
              --pairs 5 --jobs 1 --seed "$round" --show-bot-stderr 2>&1 |
              python3 -I scripts/scratch/speeds.py "runner ${{ matrix.runner }} round $round alone" | tee -a summary.txt
            "$a" match --bot "$t" --bot timing2=target/cg/bin/ice-and-fire-timing \
              --pairs 4 --jobs 4 --seed "$round" --show-bot-stderr 2>&1 |
              python3 -I scripts/scratch/speeds.py "runner ${{ matrix.runner }} round $round 4-at-a-time" | tee -a summary.txt
          done
          lscpu | grep -m1 "Model name" | tee -a summary.txt
          { echo '```text'; cat summary.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          while read -r line; do echo "::notice title=Speed::$line"; done <summary.txt
