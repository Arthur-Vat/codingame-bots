name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Unlike GitHub's default, fails a step when any command of a pipeline
    # fails, not only the last one.
    shell: bash

env:
  # CodinGame's Rust compiler (docs/CODINGAME.md, ADR 0010).
  # Keep in sync with `rust-version` in Cargo.toml.
  CG_RUST: "1.90.0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Job logs are not always at hand; annotate.sh carries a failing step's
      # output excerpt to the check run as an annotation.
      - name: Format
        run: scripts/annotate.sh run Format cargo fmt --all -- --check
      - name: Lint
        run: scripts/annotate.sh run Lint cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: scripts/annotate.sh run Test cargo test --workspace --locked

  codingame:
    name: CodinGame compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit, to see which release files a pull request adds.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Bundle every bot into one paste-ready file
        run: scripts/annotate.sh run "Bundle the bots" scripts/bundle-bots.sh
      - name: Size and standalone build of each paste-ready file
        env:
          CG_BIN_DIR: target/cg/bin
        run: scripts/annotate.sh run "Size and standalone build" scripts/cg-check.sh target/cg/*.rs
      - name: New releases match their sources; released files are frozen
        if: github.event_name == 'pull_request'
        # In a pull request, HEAD is the merge commit and HEAD^1 the base.
        run: scripts/annotate.sh run "Release check" scripts/check-releases.sh HEAD^1
      - name: Play 1,000 games between the bundled random bots
        run: |
          scripts/annotate.sh run "Build the arena" cargo build --release --locked -p uttt-arena
          scripts/annotate.sh run "1,000 random games" target/release/uttt-arena match \
            --bot random=target/cg/bin/uttt-random \
            --bot random-again=target/cg/bin/uttt-random \
            --pairs 500 --expect-no-faults --out target/cg/uttt-smoke.jsonl
      - name: Play every other bundled bot against random
        env:
          # The rules-check bot exits on any disagreement with the referee.
          CG_RULES_CHECK_STRICT: "1"
        run: |
          # Bots that search may lose a few games on time (ADR 0015).
          rate="$(sed -n 's/^MAX_TIMEOUT_RATE=//p' games/uttt/evaluation.env)"
          for bot in target/cg/bin/uttt-*; do
            name="$(basename "$bot")"
            [ "$name" = uttt-random ] && continue
            if ! out="$(target/release/uttt-arena match \
              --bot "$name=$bot" --bot random=target/cg/bin/uttt-random \
              --pairs 100 --expect-no-faults --max-timeout-rate "$rate" 2>&1)"; then
              echo "$out"
              # Job logs are hard to read from outside GitHub; an annotation
              # carries the summary to the check run.
              echo "::error title=$name against random::$(grep -E 'score|faults|slowest|error' <<<"$out" | tr '\n' ' ')"
              exit 1
            fi
            echo "$out"
          done
      - name: The evaluation tells bots apart (controls and A/A test)
        run: |
          bin=target/cg/bin
          # Runs an SPRT with fixed seeds and checks its verdict and faults.
          # The bots never look at the clock, so the outcome is reproducible.
          expect() {
            local verdict="$1" out
            shift
            out="$(target/release/uttt-arena sprt "$@" --opening-plies 4 --seed 1)" || true
            echo "$out"
            if ! grep -q "^Verdict: $verdict" <<<"$out" ||
              [ "$(grep -c '0 timeouts, 0 crashes, 0 invalid answers' <<<"$out")" != 2 ]; then
              echo "::error title=Evaluation control::expected $verdict; got $(grep -E '^Verdict|faults' <<<"$out" | tr '\n' ' ')"
              return 1
            fi
          }
          expect ACCEPTED --candidate greedy=$bin/uttt-greedy --baseline random=$bin/uttt-random
          expect REJECTED --candidate random=$bin/uttt-random --baseline greedy=$bin/uttt-greedy
          expect REJECTED --candidate greedy=$bin/uttt-greedy --baseline greedy-again=$bin/uttt-greedy
          target/release/uttt-arena league --pairs 50 --opening-plies 4 --expect-no-faults \
            --bot first-valid=$bin/uttt-first-valid --bot random=$bin/uttt-random \
            --bot greedy=$bin/uttt-greedy --anchor random | tee target/cg/league.txt
          grep -q '^  1\. greedy ' target/cg/league.txt
      - name: Engine speed
        run: |
          # The annotation of a failure stays out of the step summary.
          scripts/annotate.sh run "Engine speed" \
            cargo run --release --locked -p uttt-engine --example speed -- 3 \
            | tee target/speed.txt
          grep -v '^::error title=' target/speed.txt >>"$GITHUB_STEP_SUMMARY"
      - name: Publish the paste-ready files
        uses: actions/upload-artifact@v7
        with:
          name: paste-ready-bots
          path: target/cg/*.rs
          if-no-files-found: error
      - name: New releases replay identically with a fixed seed and iterations
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t added < <(git diff --name-only --diff-filter=A --no-renames HEAD^1 HEAD -- 'games/*/releases/*.rs')
          if [ "${#added[@]}" -eq 0 ]; then
            echo "no new release"
            exit 0
          fi
          for file in "${added[@]}"; do
            game="$(cut -d/ -f2 <<<"$file")"
            scripts/annotate.sh run "Determinism of $file" scripts/check-determinism.sh "$game" 500 "$file"
          done

  licenses:
    name: Dependency licenses and sources
    runs-on: ubuntu-latest
    env:
      # The version EmbarkStudios/cargo-deny-action used on 2026-10-11; bump
      # both together, the checksum is the archive's.
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
      - name: Install cargo-deny
        run: |
          archive="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          scripts_dir="$GITHUB_WORKSPACE/scripts"
          "$scripts_dir/annotate.sh" run "Download cargo-deny" curl -sSfL --retry 3 -O \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$archive.tar.gz"
          echo "$CARGO_DENY_SHA256  $archive.tar.gz" | "$scripts_dir/annotate.sh" run "Checksum of cargo-deny" sha256sum -c -
          tar -xzf "$archive.tar.gz"
          echo "$RUNNER_TEMP/$archive" >>"$GITHUB_PATH"
      - name: Licenses, bans, advisories and sources
        run: scripts/annotate.sh run "cargo deny" cargo deny --log-level warn --all-features check

  studio-web:
    name: Studio front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The Node line is written once, in `engines` (ADR 0026).
          node-version-file: studio/web/package.json
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: Install the locked dependencies
        id: install
        # Job logs are not always at hand; the annotation carries the failure
        # to the check run.
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "npm ci" npm ci
      # The next steps run even when an earlier one fails, so that one run
      # reports every problem.
      - name: Licenses of the packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Licenses" npm run licenses
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Format" npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Lint" npm run lint
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Type check" npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Unit tests" npm test
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Build" npm run build
      - name: Install Chromium for the browser tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Install Chromium" npx playwright install --with-deps chromium
      - name: Browser tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run e2e

  studio-windows:
    name: Studio on Windows
    # The owner runs the studio on Windows (ADR 0025). Git Bash, curl and jq
    # are preinstalled on the runner.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
      - uses: Swatinem/rust-cache@v2
      - name: Test the studio and the arena
        # The studio's server tests compile a release with rustc and play bot
        # games; the arena's unix-only tests are skipped on Windows.
        run: scripts/annotate.sh run "Test the studio and the arena" cargo test --locked -p studio -p studio-game -p uttt-studio -p cg-arena
      - name: Build the server
        run: scripts/annotate.sh run "Build the server" cargo build --locked --release -p studio
      - name: Play a bot against a bot through the server
        run: |
          port=8499
          base="http://127.0.0.1:$port"
          # An empty folder stands for the front end, which this job does not build.
          web="$RUNNER_TEMP/studio-web"
          mkdir -p "$web"
          target/release/studio.exe --port "$port" --web "$web" >studio.log 2>&1 &
          server=$!
          stop() {
            local status=$?
            kill "$server" 2>/dev/null || true
            echo "--- server log"
            cat studio.log || true
            if [ "$status" != 0 ]; then
              scripts/annotate.sh file "Studio server log" studio.log
            fi
          }
          trap stop EXIT

          up=""
          for _ in $(seq 60); do
            if curl -sS --max-time 5 "$base/api/games" >/dev/null; then
              up=yes
              break
            fi
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "::error title=Studio on Windows::the server did not answer within 60 s"
            exit 1
          fi

          seat='{"kind":"bot","release":"uttt-v001","think_ms":50,"mode":"realtime"}'
          body="{\"game\":\"uttt\",\"seed\":1,\"opening_plies\":0,\"seats\":[$seat,$seat]}"
          created="$(curl -sS --max-time 30 -X POST -H 'Content-Type: application/json' \
            -d "$body" "$base/api/sessions")"
          echo "$created"
          id="$(jq -r '.id // empty' <<<"$created" | tr -d '\r')"
          if [ -z "$id" ]; then
            echo "::error title=Studio on Windows::the session was not created"
            exit 1
          fi

          status=""
          session=""
          for _ in $(seq 120); do
            session="$(curl -sS --max-time 10 "$base/api/sessions/$id" || true)"
            status="$(jq -r '.status // empty' <<<"$session" 2>/dev/null | tr -d '\r' || true)"
            case "$status" in
              over | failed) break ;;
            esac
            sleep 1
          done
          echo "status: $status"
          jq -c '{status, error, turns: (.turns | length), result}' <<<"$session" || true
          if [ "$status" != over ]; then
            echo "::error title=Studio on Windows::the game ended with status '$status' instead of 'over'"
            exit 1
          fi

  docs:
    name: Docs and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Indexes, status lines and links match the repository
        run: scripts/annotate.sh run "Docs check" scripts/check-docs.sh
      # The next steps run even when an earlier one fails, so that one run
      # reports every problem.
      - name: Lint the shell scripts
        if: ${{ !cancelled() }}
        # Preinstalled on ubuntu-latest.
        run: scripts/annotate.sh run Shellcheck shellcheck scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh
      - name: Test the agent guard
        if: ${{ !cancelled() }}
        run: scripts/annotate.sh run "Agent guard test" scripts/tests/agent-guard-test.sh
      - name: Test the annotation wrapper
        if: ${{ !cancelled() }}
        run: scripts/annotate.sh run "Annotation wrapper test" scripts/tests/annotate-test.sh
      - name: Lint the workflows
        if: ${{ !cancelled() }}
        # The image is pinned; it includes shellcheck, which also lints the
        # `run` steps.
        run: scripts/annotate.sh run Actionlint docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
