name: League

# Rates every release of every game, with its baseline bots (ADR 0012).
# Pull requests that change the league itself run it too.
on:
  push:
    branches: [main]
    paths:
      - "games/*/releases/**"
      - "games/*/evaluation.env"
      - ".github/workflows/league.yml"
      - "scripts/league.sh"
      - "scripts/lib/evaluation.sh"
  pull_request:
    paths:
      - ".github/workflows/league.yml"
      - "scripts/league.sh"
      - "scripts/lib/evaluation.sh"
  workflow_dispatch:
    inputs:
      time_scale:
        description: "Time scale; 1 plays CodinGame's limits (default: each game's evaluation.env)"
        required: false
      time_tolerance_ms:
        description: "Milliseconds added to every limit (default: each game's evaluation.env)"
        required: false

permissions:
  contents: read

concurrency:
  group: league-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Unlike GitHub's default, fails a step when any command of a pipeline
    # fails, not only the last one.
    shell: bash

env:
  # CodinGame's Rust compiler (docs/CODINGAME.md, ADR 0010).
  CG_RUST: "1.90.0"
  CARGO_TERM_COLOR: always

jobs:
  league:
    name: Elo ratings of every release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Play each game's league
        env:
          # Empty unless given when starting the workflow by hand; empty
          # values leave each game's settings in place.
          TIME_SCALE: ${{ inputs.time_scale }}
          TIME_TOLERANCE_MS: ${{ inputs.time_tolerance_ms }}
        run: |
          # A fresh runner has no target folder yet; tee needs it.
          mkdir -p target
          for settings in games/*/evaluation.env; do
            game="$(basename "$(dirname "$settings")")"
            scripts/league.sh "$game" | tee "target/league-$game.txt"
            {
              echo "## League: $game"
              echo '```'
              cat "target/league-$game.txt"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          done
      - name: Publish the games and ratings
        uses: actions/upload-artifact@v7
        with:
          name: league
          path: |
            target/league-*.txt
            target/league/*.jsonl
