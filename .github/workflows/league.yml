name: League

# The bootstrap and the replays of the incremental league (ADR 0038, decision
# 8), started by hand only: the league of a new release runs in the SPRT
# workflow, on the release's pull request. This one plays the bots listed, in
# order, each as a new release would be (scripts/league.sh with LEAGUE_APPEND),
# until the time budget: it starts no bot once stop_after_minutes have passed,
# and says which bots come next. It changes nothing in the repository and
# posts nothing: Claude reads the new lines of each bot in the job log (skill
# github-api: job logs are readable) or in the job summary, copies them into
# games/<game>/league.jsonl in a pull request, regenerates LEADERBOARD.md, and
# starts the next run with the bots that remain. The bots are baseline bots
# (greedy) and releases (v001, v002, ...), the history in release order, as the
# results of one run are the input of the next.
on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game folder"
        required: true
        default: uttt
      bots:
        description: "Bots to add, in order, space-separated (greedy v001 v002 ...)"
        required: true
      stop_after_minutes:
        # A bot started late must still finish within the job's 360 minutes:
        # at 800 pairs a uttt bot takes about 3.5 hours (ADR 0042), so 140;
        # A Code of Ice and Fire's bots are faster (230 is safe for them).
        description: "Start no bot after this many minutes (uttt 140, ice-and-fire 230; ADR 0042)"
        required: false
        default: "140"

permissions:
  contents: read

concurrency:
  group: league-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Unlike GitHub's default, fails a step when any command of a pipeline
    # fails, not only the last one.
    shell: bash

env:
  # CodinGame's Rust compiler (docs/CODINGAME.md, ADR 0010).
  CG_RUST: "1.90.0"
  CARGO_TERM_COLOR: always

jobs:
  league:
    name: League
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check the inputs
        env:
          GAME: ${{ inputs.game }}
          BOTS: ${{ inputs.bots }}
          STOP_AFTER: ${{ inputs.stop_after_minutes }}
        run: |
          # The inputs are text from whoever starts the run: they are checked
          # before they reach a path or a command.
          if [[ ! $GAME =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error title=League::'$GAME' is not a game name"
            exit 1
          fi
          if [[ ! $STOP_AFTER =~ ^[0-9]+$ ]]; then
            echo "::error title=League::stop_after_minutes must be a number of minutes"
            exit 1
          fi
          read -r -a bots <<<"$BOTS"
          if [ "${#bots[@]}" -eq 0 ]; then
            echo "::error title=League::no bot to add"
            exit 1
          fi
          for bot in "${bots[@]}"; do
            if [[ ! $bot =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "::error title=League::'$bot' is not a bot name"
              exit 1
            fi
          done
          echo "BOT_LIST=${bots[*]}" >>"$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Check that the game is a folder of games/
        env:
          GAME: ${{ inputs.game }}
        run: |
          if [ ! -d "games/$GAME" ]; then
            echo "::error title=League::games/$GAME is not a folder of this repository"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.game }}
      - name: Play the league
        env:
          GAME: ${{ inputs.game }}
          LEAGUE_APPEND: "true"
          LEAGUE_STOP_AFTER_MINUTES: ${{ inputs.stop_after_minutes }}
        run: |
          # A fresh runner has no target folder yet; tee needs it.
          mkdir -p target
          # The names were checked above; the list is split on spaces.
          # shellcheck disable=SC2086
          scripts/annotate.sh run "League of $BOT_LIST" scripts/league.sh "$GAME" $BOT_LIST | tee "target/league-$GAME.txt"
      - name: Report
        if: ${{ !cancelled() }}
        env:
          GAME: ${{ inputs.game }}
        run: |
          if [ ! -f "target/league-$GAME.txt" ]; then
            echo "The league did not start."
            exit 0
          fi
          {
            echo "## League: $GAME"
            echo '```'
            # The annotation of a failure is for the check run only. The new
            # lines are given apart, in a block of their own.
            grep -v '^::error title=' "target/league-$GAME.txt" |
              sed '/^---- new results of /,/^---- end ----$/d' || true
            echo '```'
            echo 'New lines, in order (the same as in the log):'
            echo '```jsonl'
            sed -n '/^---- new results of /,/^---- end ----$/{/^----/d;p}' "target/league-$GAME.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Publish the games and ratings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: league-${{ inputs.game }}
          path: |
            target/league/
            !target/league/bin/
          if-no-files-found: ignore
