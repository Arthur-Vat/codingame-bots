name: Pull request hygiene

# Labels each pull request by the paths it changes and checks its title
# (ADR 0022, scripts/pr-hygiene.sh). The token of a pull request from a fork,
# or opened by Dependabot, cannot write: there only the title is checked.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: Pull request title and labels
    runs-on: ubuntu-latest
    env:
      # The token can write only when the head is in this repository and the
      # run is not Dependabot's.
      CAN_LABEL: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
      - name: Label the pull request and check its title
        if: env.CAN_LABEL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/pr-hygiene.sh pr ${{ github.event.pull_request.number }}
      - name: Check the title (read-only token)
        if: env.CAN_LABEL != 'true'
        env:
          # Through the environment, never in the script text: the title is
          # written by the author of the pull request.
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/pr-hygiene.sh title "$TITLE"
      - name: Test the script
        if: ${{ !cancelled() }}
        run: scripts/tests/pr-hygiene-test.sh
