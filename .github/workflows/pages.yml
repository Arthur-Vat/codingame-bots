name: Pages

# Publishes the studio as a static site on GitHub Pages, built from `main`
# (ADR 0030). Pull requests never deploy: CI builds the same site there.
# The repository's Pages source must be "GitHub Actions" (Settings > Pages >
# Build and deployment > Source).

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "games/*/releases/**"
      - "games/*/studio/**"
      - "games/*/referee/**"
      - "crates/cg-arena/**"
      - "crates/cg-core/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/build-studio-wasm.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # CodinGame's Rust compiler (docs/CODINGAME.md, ADR 0010), the version the
  # WebAssembly files are built with (ADR 0030).
  # Keep in sync with `CG_RUST` in ci.yml.
  CG_RUST: "1.90.0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          # The Node line is written once, in `engines` (ADR 0026).
          node-version-file: studio/web/package.json
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: Install the locked dependencies
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "npm ci" npm ci
      - name: Build the rules and the releases to WebAssembly
        # --strict: a release that does not compile to WebAssembly fails the
        # build instead of silently missing from the site. Writes public/wasm/.
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "WebAssembly build" "$GITHUB_WORKSPACE/scripts/build-studio-wasm.sh" --strict
      - name: Build the front end
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "Build" npm run build
      - name: Gather the license notices
        # Fails when a package or a crate has no license file (ADR 0030,
        # decision 7).
        run: |
          "$GITHUB_WORKSPACE/scripts/annotate.sh" run "License notices" npm run notices
      - name: Check the site
        run: |
          for file in index.html wasm/rules.wasm wasm/manifest.json coi-sw.js THIRD-PARTY-NOTICES.txt rust-library-copyright.html; do
            test -s "dist/$file" || { echo "::error title=Check the site::dist/$file is missing or empty"; exit 1; }
          done
          ls -l dist dist/wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
