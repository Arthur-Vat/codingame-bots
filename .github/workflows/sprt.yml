name: SPRT

# Tests every release file a pull request adds (ADR 0012 to 0015, 0020), one
# job per game that gets a new release (ADR 0029): a smoke test against the
# random bot, a sequential probability ratio test against the previous
# release, then, if accepted and the game asks for it, a confirmation match
# at CodinGame's exact time limits. In Legend the SPRT itself plays at those
# limits (scripts/sprt.sh, the game's evaluation.env). A game's result is
# kept for the framework's code and that game's code only. The check
# `SPRT passed` fails unless every step of every game passes; it passes when
# the pull request adds no release.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # to post the result as a comment

concurrency:
  group: sprt-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Unlike GitHub's default, fails a step when any command of a pipeline
    # fails, not only the last one.
    shell: bash

env:
  # CodinGame's Rust compiler (docs/CODINGAME.md, ADR 0010).
  CG_RUST: "1.90.0"
  CARGO_TERM_COLOR: always

jobs:
  # The games that get a new release in this pull request.
  releases:
    name: New releases
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.scopes.outputs.games }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit, to see which files a pull request adds.
          fetch-depth: 2
      - name: Find the games with a new release
        id: scopes
        run: |
          # In a pull request, HEAD is the merge commit and HEAD^1 the base.
          # NUL-separated: git quotes the odd file names otherwise.
          mapfile -d '' -t files < <(git diff -z --name-only --diff-filter=A --no-renames HEAD^1 HEAD -- 'games/*/releases/*.rs')
          scopes="$(scripts/ci-scopes.sh sprt -- "${files[@]}")" || {
            echo "::error title=New releases::scripts/ci-scopes.sh failed"
            exit 1
          }
          echo "$scopes" | tee -a "$GITHUB_OUTPUT"
          if [ "$scopes" = 'games=[]' ]; then
            echo "No new release in this pull request: nothing to test." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '```text'
              echo "$scopes"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

  sprt:
    name: "${{ matrix.game }}: SPRT"
    needs: releases
    # An empty matrix is an error: skip the job instead.
    if: needs.releases.outputs.games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.releases.outputs.games) }}
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Find new releases
        id: find
        run: |
          # In a pull request, HEAD is the merge commit and HEAD^1 the base.
          # NUL-separated: git quotes the odd file names otherwise.
          mapfile -d '' -t files < <(git diff -z --name-only --diff-filter=A --no-renames HEAD^1 HEAD -- "games/$GAME/releases/*.rs")
          candidates=""
          for file in "${files[@]}"; do
            # Directly in the game's releases folder.
            if [[ "${file#"games/$GAME/releases/"}" == */* ]]; then
              continue
            fi
            # The list is space separated below.
            if [[ ! $file =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error title=$GAME SPRT::unsupported characters in the name of $file"
              exit 1
            fi
            candidates="$candidates $file"
          done
          candidates="${candidates# }"
          echo "candidates=$candidates" >>"$GITHUB_OUTPUT"
          if [ -z "$candidates" ]; then
            echo "No new release of $GAME in this pull request: nothing to test." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # A result is kept for the exact code and settings it was obtained
          # with: the framework's and this game's, not another game's, and
          # editing only Markdown (the journal) does not run it again.
          # Re-running the job on GitHub does (see the next step).
          hash="$(git ls-tree -r HEAD -- Cargo.toml Cargo.lock crates scripts "games/$GAME" | grep -v '\.md$' | sha256sum | cut -c 1-20)"
          echo "key=sprt-$GAME-$hash" >>"$GITHUB_OUTPUT"
      - name: Reuse the latest result on the same code
        id: cache
        # A re-run of this job (attempt 2 or more) always tests again, for
        # example after a timeout caused by the machine. Each test posts its
        # result, so retries stay visible.
        if: steps.find.outputs.candidates != '' && github.run_attempt == '1'
        uses: actions/cache/restore@v6
        with:
          path: target/sprt-result
          key: ${{ steps.find.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.find.outputs.key }}-
      - uses: dtolnay/rust-toolchain@master
        if: steps.find.outputs.candidates != '' && steps.cache.outputs.cache-matched-key == ''
        with:
          toolchain: ${{ env.CG_RUST }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.find.outputs.candidates != '' && steps.cache.outputs.cache-matched-key == ''
        with:
          key: ${{ matrix.game }}
      - name: Smoke test and SPRT
        id: run
        if: steps.find.outputs.candidates != '' && steps.cache.outputs.cache-matched-key == ''
        env:
          CANDIDATES: ${{ steps.find.outputs.candidates }}
          # A sample of the games, uploaded below (ADR 0027).
          RECORDS_DIR: target/records
        run: |
          mkdir -p target/sprt-result
          # The annotation of a failure is for the check run, not the report
          # that is posted.
          drop_annotations() { sed -i '/^::error title=/d' target/sprt-result/report.txt; }
          status=0
          for candidate in $CANDIDATES; do
            set +e
            scripts/annotate.sh run "SPRT of $candidate" scripts/sprt.sh "$GAME" "$candidate" | tee -a target/sprt-result/report.txt
            code="${PIPESTATUS[0]}"
            set -e
            # Status 2 is an error, not a verdict: keep no result.
            if [ "$code" -ge 2 ]; then
              drop_annotations
              exit "$code"
            fi
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          drop_annotations
          echo "$status" >target/sprt-result/status
          # Identifies this result in the comment that posts it.
          echo "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >target/sprt-result/origin
      - name: Upload a sample of the games
        # Nothing to upload when the result was reused or there was no new
        # release: the folder does not exist and the step finds no file.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: game-records-${{ matrix.game }}
          path: target/records
          if-no-files-found: ignore
          retention-days: 30
      - name: Keep the result
        if: steps.run.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: target/sprt-result
          key: ${{ steps.find.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report
        if: steps.find.outputs.candidates != ''
        env:
          REUSED: ${{ steps.cache.outputs.cache-matched-key != '' }}
        run: |
          {
            echo "## SPRT: $GAME"
            if [ "$REUSED" = true ]; then
              echo "Result of an earlier run on the same code and settings."
            fi
            echo '```'
            cat target/sprt-result/report.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Post the result on the pull request
        # Posted once per result, also when an earlier run produced it. A
        # failure to post does not change the verdict: the result is in the
        # job summary too.
        if: >-
          !cancelled() && steps.find.outputs.candidates != ''
          && (steps.run.outcome == 'success' || steps.cache.outputs.cache-matched-key != '')
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REUSED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          origin="$(cat target/sprt-result/origin 2>/dev/null || echo "$REUSED_KEY")"
          marker="<!-- sprt-result $GAME $origin -->"
          comments="$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].body')"
          if grep -qF "$marker" <<<"$comments"; then
            echo "This result is already on the pull request."
            exit 0
          fi
          {
            echo "$marker"
            echo "### SPRT result for $GAME at ${HEAD_SHA:0:7}"
            if [ -n "$REUSED_KEY" ]; then
              echo "From an earlier run on the same code and settings."
            fi
            echo '```'
            cat target/sprt-result/report.txt
            echo '```'
            echo "[Run]($RUN_URL)"
          } >target/sprt-comment.md
          if ! gh pr comment "$PR" --body-file target/sprt-comment.md; then
            echo "::warning title=SPRT comment::the result could not be posted; it is in the job summary"
            exit 1
          fi
      - name: Verdict
        if: >-
          !cancelled() && steps.find.outputs.candidates != ''
          && (steps.run.outcome == 'success' || steps.cache.outputs.cache-matched-key != '')
        run: exit "$(cat target/sprt-result/status)"

  # The required check (ADR 0029). Always runs, and fails when the search for
  # new releases or any game's SPRT failed or was cancelled.
  sprt-passed:
    name: SPRT passed
    needs:
      - releases
      - sprt
    # Never `!cancelled()`: GitHub counts a skipped required check as passed,
    # so this job must run when the run is cancelled too, and then fail.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Every SPRT that had to run succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          GAMES: ${{ needs.releases.outputs.games }}
        run: |
          # Empty when the releases job failed: the verdict then fails.
          case "$GAMES" in
            '') HAS_GAMES='' ;;
            '[]') HAS_GAMES=false ;;
            *) HAS_GAMES=true ;;
          esac
          scripts/ci-scopes.sh results releases=true sprt="$HAS_GAMES"
