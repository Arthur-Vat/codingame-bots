name: Release

# Publishes a GitHub release, tagged with the version, for every release
# file on main that has none yet, with the paste-ready file attached, and the
# readable copy of the release when it has one (ADR 0045). When it publishes
# a new release of the game the CodinGame collection plays, it starts a run of
# that workflow (codingame-collect.yml, on main), so that the day's games are
# played with the newest release (ADR 0059).
on:
  push:
    branches: [main]
    paths:
      - "games/*/releases/**"

permissions:
  contents: write # to create tags and releases

env:
  # The game the CodinGame collection plays: the GAME of codingame-collect.yml
  # (scripts/tests/codingame-collect-test.sh checks that they agree).
  COLLECTED_GAME: ice-and-fire

defaults:
  run:
    # Unlike GitHub's default, fails a step when any command of a pipeline
    # fails, not only the last one.
    shell: bash

jobs:
  release:
    name: GitHub release of each new version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      collect: ${{ steps.collect.outputs.collect }}
    steps:
      - uses: actions/checkout@v7
      - name: Create the missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for file in games/*/releases/*.rs; do
            tag="$(basename "$file" .rs)"
            if gh release view "$tag" >/dev/null 2>&1; then
              continue
            fi
            game="$(cut -d/ -f2 <<<"$file")"
            entry="$(grep -rlx -- "release: $tag" "games/$game/journal/" | head -n 1 || true)"
            notes="Paste-ready bot $tag: copy the attached file $tag.rs into the CodinGame IDE."
            assets=("$file")
            # Releases made since ADR 0045 have a readable copy, with the same
            # name as the release: attached under another name.
            readable="games/$game/readable/$tag.rs"
            if [ -f "$readable" ]; then
              mkdir -p "$RUNNER_TEMP/readable"
              cp "$readable" "$RUNNER_TEMP/readable/$tag-readable.rs"
              assets+=("$RUNNER_TEMP/readable/$tag-readable.rs")
              notes="$notes The same bot with its comments and names, to read, is $tag-readable.rs."
            fi
            if [ -n "$entry" ]; then
              notes="$notes Journal: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$entry"
            fi
            scripts/annotate.sh run "Release $tag" gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
            echo "$game" >>"$RUNNER_TEMP/released-games"
          done
      - name: Whether a release of the collected game was published
        id: collect
        run: |
          if grep -qx -- "$COLLECTED_GAME" "$RUNNER_TEMP/released-games" 2>/dev/null; then
            echo "collect=true" >>"$GITHUB_OUTPUT"
          fi

  collect:
    # A run of the collection with the new release (ADR 0059): a run already
    # going stops before its next game, and this one waits for it. A job of
    # its own, so that only it may start workflows.
    name: Start the CodinGame collection with the new release
    needs: release
    if: needs.release.outputs.collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # to dispatch codingame-collect.yml
    steps:
      - name: Dispatch codingame-collect.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run codingame-collect.yml --repo "$GITHUB_REPOSITORY" --ref main -f play=true
