name: Train

# Self-play and training for Ultimate Tic-Tac-Toe (ADR 0016). Started by
# hand only: self-play games run in parallel jobs, then one job fits the
# playout policy (stage 1), the value network (stage 2, ADR 0017) or the
# move models of E015 and E016 (patterns), and commits the weights and a
# report to a new branch claude/train/<run id>.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "What to train: the playout policy, the value network, or the move models (patterns)"
        type: choice
        options: [policy, value, patterns]
        default: policy
      jobs:
        description: "Self-play jobs run at the same time, 1 to 20"
        default: "8"
      games:
        description: "Games per job (each job plays them on its 4 cores)"
        default: "1000"
      iterations:
        description: "Search iterations per move"
        default: "10000"
      opening_plies:
        description: "Random moves at the start of each game"
        default: "6"
      temperature:
        description: "Policy and patterns: divides the fitted log-weights; below 1 sharpens them"
        default: "1"
      target:
        description: "Value: what the network learns (result, score or mix)"
        default: "result"
      epochs:
        description: "Value and patterns: passes over the positions"
        default: "8"
      duel_exploration:
        description: "Value: exploration of the network's search against the playouts'"
        default: "0.3"
      size:
        description: "Value: the network's hidden layers (64-16 or 128-32)"
        default: "64-16"
      data_from_run:
        description: "Fit only, on the self-play data of this earlier run (kept 7 days); empty plays new games"
        default: ""

permissions:
  contents: read

defaults:
  run:
    # Unlike GitHub's default, fails a step when any command of a pipeline
    # fails, not only the last one.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CG_RUST: "1.90.0"

jobs:
  plan:
    name: Plan the self-play jobs
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - id: shards
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          if ! [[ $JOBS =~ ^[0-9]+$ ]] || ((JOBS < 1 || JOBS > 20)); then
            echo "::error::jobs must be a number from 1 to 20, not '$JOBS'"
            exit 1
          fi
          shards="$(seq -s, 0 $((JOBS - 1)))"
          echo "shards=[$shards]" >> "$GITHUB_OUTPUT"

  selfplay:
    name: Self-play ${{ matrix.shard }}
    needs: plan
    if: inputs.data_from_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the trainer
        run: cargo build --release --locked -p uttt-trainer
      - name: Play
        env:
          STAGE: ${{ inputs.stage }}
          GAMES: ${{ inputs.games }}
          ITERATIONS: ${{ inputs.iterations }}
          OPENING_PLIES: ${{ inputs.opening_plies }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p target/train
          # The value network learns from games of the bot's own search,
          # with its playouts; the policy, from searches' visits; the move
          # models, from the visits of the bot's search with its pattern
          # policy, which also orders each node's children.
          options=()
          if [[ $STAGE == value ]]; then
            options=(--policy games/uttt/bots/mcts/src/weights.rs --no-visits)
          elif [[ $STAGE == patterns ]]; then
            options=(--patterns games/uttt/bots/mcts/src/pattern_weights.rs)
          fi
          # One process per core, each with its own seed and share of games.
          cores="$(nproc)"
          for ((core = 0; core < cores; core++)); do
            share=$(((GAMES + cores - 1 - core) / cores))
            seed=$((GITHUB_RUN_ID * 1000 + SHARD * 10 + core))
            target/release/uttt-trainer selfplay --games "$share" \
              --iterations "$ITERATIONS" --opening-plies "$OPENING_PLIES" \
              "${options[@]}" --seed "$seed" \
              --out "target/train/selfplay-$SHARD-$core.bin" &
          done
          wait
      - uses: actions/upload-artifact@v7
        with:
          name: selfplay-${{ matrix.shard }}
          path: target/train/*.bin
          retention-days: 7

  fit:
    name: Fit the ${{ inputs.stage == 'value' && 'value network' || inputs.stage == 'patterns' && 'move models' || 'playout policy' }}
    needs: selfplay
    # Also when self-play was skipped for an earlier run's data.
    if: ${{ !cancelled() && (needs.selfplay.result == 'success' || needs.selfplay.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      # To push the claude/train/<run id> branch with the results.
      contents: write
      # To read an earlier run's self-play data.
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the trainer
        run: cargo build --release --locked -p uttt-trainer
      - uses: actions/download-artifact@v7
        with:
          pattern: selfplay-*
          path: target/train
          merge-multiple: true
          # This run's artifacts, or those of `data_from_run`.
          run-id: ${{ inputs.data_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Fit
        env:
          STAGE: ${{ inputs.stage }}
          JOBS: ${{ inputs.jobs }}
          GAMES: ${{ inputs.games }}
          ITERATIONS: ${{ inputs.iterations }}
          OPENING_PLIES: ${{ inputs.opening_plies }}
          TEMPERATURE: ${{ inputs.temperature }}
          TARGET: ${{ inputs.target }}
          EPOCHS: ${{ inputs.epochs }}
          DUEL_EXPLORATION: ${{ inputs.duel_exploration }}
          SIZE: ${{ inputs.size }}
          DATA_FROM_RUN: ${{ inputs.data_from_run }}
        run: |
          out="games/uttt/training/runs/$GITHUB_RUN_ID"
          mkdir -p "$out"
          data=()
          for file in target/train/*.bin; do
            data+=(--data "$file")
          done
          origin="run $GITHUB_RUN_ID of commit $GITHUB_SHA, $JOBS jobs of $GAMES games at $ITERATIONS iterations, $OPENING_PLIES opening plies"
          if [[ -n $DATA_FROM_RUN ]]; then
            origin="run $GITHUB_RUN_ID of commit $GITHUB_SHA, on the self-play data of run $DATA_FROM_RUN"
          fi
          if [[ $STAGE == value ]]; then
            target/release/uttt-trainer fit-value "${data[@]}" \
              --target "$TARGET" --epochs "$EPOCHS" --size "$SIZE" \
              --policy games/uttt/bots/mcts/src/weights.rs \
              --duel-exploration "$DUEL_EXPLORATION" --origin "$origin" \
              --weights-out "$out/value_weights.rs" --report-out "$out/report.md"
          elif [[ $STAGE == patterns ]]; then
            target/release/uttt-trainer fit-patterns "${data[@]}" \
              --models all --epochs "$EPOCHS" --temperature "$TEMPERATURE" \
              --origin "$origin" --weights-dir "$out" --report-out "$out/report.md"
          else
            target/release/uttt-trainer fit-policy "${data[@]}" \
              --temperature "$TEMPERATURE" --origin "$origin" \
              --weights-out "$out/weights.rs" --report-out "$out/report.md"
          fi
          cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the results to claude/train/${{ github.run_id }}
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          branch="claude/train/$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "games/uttt/training/runs/$GITHUB_RUN_ID"
          what="playout policy"
          [[ $STAGE == value ]] && what="value network"
          [[ $STAGE == patterns ]] && what="move models"
          git commit -m "chore(train): $what from run $GITHUB_RUN_ID"
          git push origin "$branch"
