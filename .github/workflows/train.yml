name: Train

# Self-play and training for Ultimate Tic-Tac-Toe (ADR 0016). Started by
# hand only: self-play games run in parallel jobs, then one job fits the
# playout policy (stage 1), the value network (stage 2, ADR 0017), the
# move models of E015 and E016 (patterns) or the NNUE of
# uttt_engine::nnue (nnue), and commits the weights and a report to a new
# branch claude/train/<run id>.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "What to train: the playout policy, the value network, the move models (patterns) or the NNUE (nnue)"
        type: choice
        options: [policy, value, patterns, nnue]
        default: policy
      jobs:
        description: "Self-play jobs run at the same time, 1 to 20"
        default: "8"
      games:
        description: "Games per job (each job plays them on its 4 cores)"
        default: "1000"
      iterations:
        description: "Search iterations per move"
        default: "10000"
      opening_plies:
        description: "Moves at the start of each game drawn at random (nnue: in proportion to the search's visits, and recorded)"
        default: "6"
      temperature:
        description: "Policy and patterns: divides the fitted log-weights; below 1 sharpens them"
        default: "1"
      target:
        description: "Value and NNUE: what the network learns (result, score or mix)"
        default: "result"
      epochs:
        description: "Value, patterns and NNUE: passes over the positions"
        default: "8"
      duel_exploration:
        description: "Value: exploration of the network's search against the playouts'"
        default: "0.3"
      size:
        description: "Value: the network's hidden layers (64-16 or 128-32)"
        default: "64-16"
      width:
        description: "NNUE: the accumulator's width (128, 256 or 512)"
        default: "256"
      data_from_run:
        description: "Fit only, on the self-play data of this earlier run (kept 7 days); empty plays new games"
        default: ""

permissions:
  contents: read

defaults:
  run:
    # Unlike GitHub's default, fails a step when any command of a pipeline
    # fails, not only the last one.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CG_RUST: "1.90.0"

jobs:
  plan:
    name: Plan the self-play jobs
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - id: shards
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          if ! [[ $JOBS =~ ^[0-9]+$ ]] || ((JOBS < 1 || JOBS > 20)); then
            echo "::error::jobs must be a number from 1 to 20, not '$JOBS'"
            exit 1
          fi
          shards="$(seq -s, 0 $((JOBS - 1)))"
          echo "shards=[$shards]" >> "$GITHUB_OUTPUT"

  selfplay:
    name: Self-play ${{ matrix.shard }}
    needs: plan
    if: inputs.data_from_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # For this runner's processor: the trainer is a tool, not a bot, and is
    # built and run on the same machine. Fits went about 45% faster with it
    # on 2026-10-15, with the same weights bit for bit there.
    env:
      RUSTFLAGS: -C target-cpu=native
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
      # The cache's key names the processor: builds for one runner's
      # processor (RUSTFLAGS, set on the job) may not run on another's.
      - name: Name this runner's processor
        id: cpu
        run: echo "key=$(grep -E '^(model name|flags)' /proc/cpuinfo | sort -u | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ steps.cpu.outputs.key }}
      - name: Build the trainer
        run: cargo build --release --locked -p uttt-trainer
      - name: Play
        env:
          STAGE: ${{ inputs.stage }}
          GAMES: ${{ inputs.games }}
          ITERATIONS: ${{ inputs.iterations }}
          OPENING_PLIES: ${{ inputs.opening_plies }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p target/train
          # The value network learns from games of the bot's own search,
          # with its playouts; the policy, from searches' visits; the move
          # models, from the visits of `uttt-v010`'s search with its pattern
          # policy, which also orders each node's children; the NNUE, from
          # games of the newest release's own search and network (a test
          # of the trainer checks these settings against it), whose root
          # scores and results it learns. Its openings are searched and
          # recorded, each move drawn in proportion to the square root of its
          # visits (temperature 2: the search is deterministic from a
          # position, so at temperature 1 a third of 1.9M games copied
          # another), and a game whose first search after them expects
          # above 0.9 or below 0.1 is dropped.
          options=()
          if [[ $STAGE == value ]]; then
            options=(--policy games/uttt/training/class_weights.rs --no-visits)
          elif [[ $STAGE == patterns ]]; then
            options=(--patterns games/uttt/training/pattern_weights.rs)
          elif [[ $STAGE == nnue ]]; then
            options=(--network games/uttt/bots/mcts/src/nnue_weights.rs --exploration 0.2 --expand-all --minimax-weight 0.5 --opening sampled --opening-temperature 2 --balance 0.9 --no-visits)
          fi
          # One process per core, each with its own seed and share of games,
          # whose progress lines start with its name.
          cores="$(nproc)"
          for ((core = 0; core < cores; core++)); do
            share=$(((GAMES + cores - 1 - core) / cores))
            seed=$((GITHUB_RUN_ID * 1000 + SHARD * 10 + core))
            target/release/uttt-trainer selfplay --games "$share" \
              --iterations "$ITERATIONS" --opening-plies "$OPENING_PLIES" \
              "${options[@]}" --seed "$seed" --name "core $core" \
              --out "target/train/selfplay-$SHARD-$core.bin" &
          done
          wait
      - uses: actions/upload-artifact@v7
        with:
          name: selfplay-${{ matrix.shard }}
          path: target/train/*.bin
          retention-days: 7

  fit:
    name: Fit the ${{ inputs.stage == 'value' && 'value network' || inputs.stage == 'patterns' && 'move models' || inputs.stage == 'nnue' && 'NNUE' || 'playout policy' }}
    needs: selfplay
    # Also when self-play was skipped for an earlier run's data.
    if: ${{ !cancelled() && (needs.selfplay.result == 'success' || needs.selfplay.result == 'skipped') }}
    runs-on: ubuntu-latest
    # For this runner's processor: the trainer is a tool, not a bot, and is
    # built and run on the same machine. Fits went about 45% faster with it
    # on 2026-10-15, with the same weights bit for bit there.
    env:
      RUSTFLAGS: -C target-cpu=native
    permissions:
      # To push the claude/train/<run id> branch with the results.
      contents: write
      # To read an earlier run's self-play data.
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CG_RUST }}
      # The cache's key names the processor: builds for one runner's
      # processor (RUSTFLAGS, set on the job) may not run on another's.
      - name: Name this runner's processor
        id: cpu
        run: echo "key=$(grep -E '^(model name|flags)' /proc/cpuinfo | sort -u | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ steps.cpu.outputs.key }}
      - name: Build the trainer
        run: cargo build --release --locked -p uttt-trainer
      - uses: actions/download-artifact@v8
        with:
          pattern: selfplay-*
          path: target/train
          merge-multiple: true
          # This run's artifacts, or those of `data_from_run`.
          run-id: ${{ inputs.data_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Fit
        env:
          STAGE: ${{ inputs.stage }}
          JOBS: ${{ inputs.jobs }}
          GAMES: ${{ inputs.games }}
          ITERATIONS: ${{ inputs.iterations }}
          OPENING_PLIES: ${{ inputs.opening_plies }}
          TEMPERATURE: ${{ inputs.temperature }}
          TARGET: ${{ inputs.target }}
          EPOCHS: ${{ inputs.epochs }}
          DUEL_EXPLORATION: ${{ inputs.duel_exploration }}
          SIZE: ${{ inputs.size }}
          WIDTH: ${{ inputs.width }}
          DATA_FROM_RUN: ${{ inputs.data_from_run }}
        run: |
          out="games/uttt/training/runs/$GITHUB_RUN_ID"
          mkdir -p "$out"
          data=()
          for file in target/train/*.bin; do
            data+=(--data "$file")
          done
          origin="run $GITHUB_RUN_ID of commit $GITHUB_SHA, $JOBS jobs of $GAMES games at $ITERATIONS iterations, $OPENING_PLIES opening plies"
          if [[ -n $DATA_FROM_RUN ]]; then
            origin="run $GITHUB_RUN_ID of commit $GITHUB_SHA, on the self-play data of run $DATA_FROM_RUN"
          fi
          if [[ $STAGE == value ]]; then
            target/release/uttt-trainer fit-value "${data[@]}" \
              --target "$TARGET" --epochs "$EPOCHS" --size "$SIZE" \
              --policy games/uttt/training/class_weights.rs \
              --duel-exploration "$DUEL_EXPLORATION" --origin "$origin" \
              --weights-out "$out/value_weights.rs" --report-out "$out/report.md"
          elif [[ $STAGE == nnue ]]; then
            # Measured beside the bot's network on the same positions; games
            # that copy an earlier one are dropped.
            target/release/uttt-trainer fit-nnue "${data[@]}" \
              --target "$TARGET" --epochs "$EPOCHS" --width "$WIDTH" \
              --compare-network games/uttt/bots/mcts/src/nnue_weights.rs \
              --origin "$origin" \
              --weights-out "$out/nnue_weights.rs" --report-out "$out/report.md"
          elif [[ $STAGE == patterns ]]; then
            target/release/uttt-trainer fit-patterns "${data[@]}" \
              --models all --epochs "$EPOCHS" --temperature "$TEMPERATURE" \
              --origin "$origin" --weights-dir "$out" --report-out "$out/report.md"
          else
            target/release/uttt-trainer fit-policy "${data[@]}" \
              --temperature "$TEMPERATURE" --origin "$origin" \
              --weights-out "$out/weights.rs" --report-out "$out/report.md"
          fi
          cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
          # The results' table, also as an annotation readable through the
          # API.
          table="$(grep '^| ' "$out/report.md" | head -n 14)"
          echo "::notice title=Fit results::${table//$'\n'/ // }"
      - name: Commit the results to claude/train/${{ github.run_id }}
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          branch="claude/train/$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "games/uttt/training/runs/$GITHUB_RUN_ID"
          what="playout policy"
          [[ $STAGE == value ]] && what="value network"
          [[ $STAGE == patterns ]] && what="move models"
          [[ $STAGE == nnue ]] && what="NNUE"
          git commit -m "chore(train): $what from run $GITHUB_RUN_ID"
          # Job logs are not readable everywhere; an annotation is.
          if ! output="$(git push origin "$branch" 2>&1)"; then
            echo "::error title=Push failed::${output//$'\n'/ | }"
            exit 1
          fi
