version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
  - package-ecosystem: npm
    directory: /studio/web
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
