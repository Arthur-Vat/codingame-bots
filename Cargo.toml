[workspace]
# Resolver 3 picks dependency versions that support `rust-version`.
resolver = "3"
members = [
    "crates/*",
    "games/*/analysis",
    "games/*/engine",
    "games/*/referee",
    "games/*/arena",
    "games/*/policy",
    "games/*/trainer",
    "games/*/value",
    "games/*/bots/*",
    "games/*/studio",
    "studio/core",
    "studio/game",
    "studio/rules",
    "studio/server",
]

[workspace.package]
version = "0.0.0"
authors = ["Arthur-V"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Arthur-Vat/codingame-bots"
publish = false
# CodinGame compiles Rust 1.90.0 with the 2021 edition (checked 2026-10-06).
# `rust-version` makes clippy reject std APIs newer than that; CI builds with
# exactly 1.90.0. See docs/adr/0010-codingame-rust-toolchain.md.
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
# Workspace crates.
cg-arena = { path = "crates/cg-arena" }
cg-core = { path = "crates/cg-core" }
cg-pack = { path = "crates/cg-pack" }
cg-packer = { path = "crates/cg-packer" }
cg-search = { path = "crates/cg-search" }
ice-and-fire-engine = { path = "games/ice-and-fire/engine" }
ice-and-fire-policy = { path = "games/ice-and-fire/policy" }
ice-and-fire-referee = { path = "games/ice-and-fire/referee" }
ice-and-fire-studio = { path = "games/ice-and-fire/studio" }
studio-core = { path = "studio/core" }
studio-game = { path = "studio/game" }
uttt-analysis = { path = "games/uttt/analysis" }
uttt-engine = { path = "games/uttt/engine" }
uttt-policy = { path = "games/uttt/policy" }
uttt-referee = { path = "games/uttt/referee" }
uttt-studio = { path = "games/uttt/studio" }
uttt-value = { path = "games/uttt/value" }
# Tools only. Nothing that ends up in a bot may depend on these.
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
